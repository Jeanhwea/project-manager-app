<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#533483"/>
      <stop offset="100%" stop-color="#3b1f6e"/>
    </linearGradient>
    <linearGradient id="textG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Git branch icon (simplified) -->
  <g transform="translate(40, 40)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Trunk -->
    <line x1="80" y1="30" x2="80" y2="380" stroke="url(#branch)" stroke-width="32"/>
    <!-- Right branch -->
    <path d="M80 120 C 160 120, 160 200, 160 260" stroke="url(#branch)" stroke-width="24"/>
    <!-- Left branch -->
    <path d="M80 220 C 30 220, 30 320, 30 380" stroke="url(#branch)" stroke-width="24"/>
    <!-- Leaf nodes -->
    <circle cx="80" cy="30" r="22" fill="url(#branch)"/>
    <circle cx="160" cy="260" r="18" fill="url(#branch)"/>
    <circle cx="30" cy="380" r="18" fill="url(#branch)"/>
  </g>

  <!-- "pm" text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="160" text-anchor="middle" fill="#fff" letter-spacing="8">pm</text>
</svg>
